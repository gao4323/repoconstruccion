<div class="modal">
  <div class="modal-content">

    <h2>Editar servicio</h2>

    <form #miForm="ngForm" (ngSubmit)="onGuardar(miForm)">
      <label>Nombre:</label>
      <input type="text" [(ngModel)]="servicio()!.nombre" name="nombre" required>

      <label>Descripción:</label>
      <input type="text" [(ngModel)]="servicio()!.descripcion" name="descripcion" required>

      <label>Precio:</label>
      <input type="number" [(ngModel)]="servicio()!.precio" name="precio" required>

      <div class="botones">
        <button type="button" (click)="cerrar.emit()">Cancelar</button>
        <button type="submit">Guardar</button>
      </div>
    </form>

  </div>
</div>
